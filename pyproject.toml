[project]
name = "capstone"
version = "0.1.0"
description = "Flyrank Capstone Project - AI Image relevance content matching engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
     "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "psycopg[binary]==3.1.14",
    "alembic==1.13.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "google-genai==0.3.0",
    "tenacity==8.2.3",
    "python-dotenv==1.0.0",
    "pillow==10.1.0",
    "pandas==2.1.3",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "httpx==0.25.2",
]
