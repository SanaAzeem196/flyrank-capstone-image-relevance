services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
      POSTGRES_DB: capstone
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://capstone:capstone@db:5432/capstone
    ports:
      - "8000:8000"
    volumes:
      - ./corpus:/app/corpus
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://capstone:capstone@db:5432/capstone
    volumes:
      - ./corpus:/app/corpus
    command: python -m src.worker.main

volumes:
  db_data:
